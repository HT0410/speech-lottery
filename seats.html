<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>座席シャッフル抽選</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #0d0f1a;
    --surface: #161929;
    --border:  #2a2f4a;
    --accent:  #f5c842;
    --teal:    #4ecdc4;
    --red:     #ff6b6b;
    --purple:  #a78bfa;
    --orange:  #fb923c;
    --text:    #eef0ff;
    --muted:   #6b7199;
    --radius:  16px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 17px; }
  body {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 56px 20px 80px; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(245,200,66,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,200,66,.035) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0;
  }

  #nav-link {
    position: fixed; top: 16px; left: 16px; z-index: 200;
    padding: 10px 16px; font-size: .85rem;
    background: rgba(22,25,41,.86); color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px;
    backdrop-filter: blur(8px); text-decoration: none;
  }
  #nav-link:hover { color: var(--text); background: var(--border); }

  main {
    position: relative; z-index: 1; width: 100%; max-width: 1000px;
    display: flex; flex-direction: column; gap: 26px;
  }

  header { text-align: center; }
  .label {
    display: inline-block; font-family: 'DM Mono', monospace;
    font-size: .72rem; letter-spacing: .18em; color: var(--accent);
    border: 1px solid var(--accent); padding: 5px 14px;
    border-radius: 100px; margin-bottom: 16px; text-transform: uppercase;
  }
  h1 { font-size: 2.1rem; font-weight: 900; letter-spacing:-.01em; line-height:1.25; }
  h1 span { color: var(--accent); }
  .sub { margin-top:10px; font-size:.9rem; color:var(--muted); line-height:1.6; }

  section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px 26px;
  }
  section h2 {
    font-size: 1.05rem; font-weight: 700; margin-bottom: 6px;
    display:flex; align-items:center; gap:8px;
  }
  section .desc { font-size:.82rem; color:var(--muted); margin-bottom:18px; line-height:1.6; }

  /* ===== 生徒設定 ===== */
  #student-list { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .student-row {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:var(--bg); border:1px solid var(--border); border-radius:10px;
    padding:8px 10px;
  }
  .student-row .idx {
    font-family:'DM Mono',monospace; font-size:.75rem; color:var(--muted);
    width:22px; text-align:right; flex-shrink:0;
  }
  .student-row input[type=text] {
    flex: 1 1 120px; min-width:90px;
    background:transparent; border:none; color:var(--text);
    font-family:'Zen Kaku Gothic New',sans-serif; font-size:.95rem;
    padding:6px 4px; border-bottom:1px solid transparent;
  }
  .student-row input[type=text]:focus { outline:none; border-bottom:1px solid var(--accent); }
  .pref-chip {
    font-family:'DM Mono',monospace; font-size:.72rem; letter-spacing:.02em;
    padding:6px 12px; border-radius:100px; cursor:pointer; user-select:none;
    background:transparent; color:var(--muted); border:1px solid var(--border);
    transition:all .15s; white-space:nowrap;
  }
  .pref-chip.on.screen { background:rgba(78,205,196,.15); color:var(--teal); border-color:rgba(78,205,196,.4); }
  .pref-chip.on.sub    { background:rgba(167,139,250,.15); color:var(--purple); border-color:rgba(167,139,250,.4); }
  .del-btn {
    margin-left:auto; background:none; border:none; color:var(--muted);
    font-size:1rem; cursor:pointer; padding:4px 8px; border-radius:8px;
    flex-shrink:0;
  }
  .del-btn:hover { color:var(--red); background:rgba(255,107,107,.1); }

  .list-actions { display:flex; gap:10px; flex-wrap:wrap; }
  .ghost-btn {
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:.85rem;
    padding:10px 18px; border-radius:100px; cursor:pointer;
    background:transparent; color:var(--muted); border:1px solid var(--border);
    transition:all .15s;
  }
  .ghost-btn:hover { color:var(--text); border-color:var(--muted); }
  .ghost-btn.warn:hover { color:var(--red); border-color:rgba(255,107,107,.4); }
  .count-note { font-size:.8rem; color:var(--muted); font-family:'DM Mono',monospace; margin-top:10px; }
  .count-note.over { color:var(--red); }

  /* ===== 凡例 ===== */
  .legend { display:flex; gap:18px; flex-wrap:wrap; margin-bottom:16px; }
  .legend-item { display:flex; align-items:center; gap:8px; font-size:.82rem; color:var(--muted); }
  .legend-dot { width:12px; height:12px; border-radius:4px; flex-shrink:0; }

  /* ===== 座席表 ===== */
  .map-scroll { overflow-x:auto; padding-bottom:6px; }
  .scroll-hint { font-size:.75rem; color:var(--muted); text-align:right; display:none; margin-bottom:6px; }
  #seat-map {
    display:grid;
    grid-template-columns: 84px 84px 84px 84px 34px 84px 84px 84px;
    grid-auto-rows: min-content;
    gap:8px 10px;
    min-width: 700px;
    padding: 4px;
  }
  .cell {
    display:flex; align-items:center; justify-content:center;
    text-align:center; border-radius:10px;
  }
  .cell-label {
    font-family:'DM Mono',monospace; font-size:.72rem; letter-spacing:.06em;
    color:var(--muted); background:var(--bg); border:1px dashed var(--border);
    padding:10px 6px; white-space:nowrap;
  }
  .cell-teacher {
    font-weight:700; font-size:.88rem; color:var(--accent);
    background:rgba(245,200,66,.1); border:1px solid rgba(245,200,66,.35);
    padding:16px 6px;
  }
  .zone-caption {
    font-family:'DM Mono',monospace; font-size:.7rem; letter-spacing:.08em;
    padding:6px 4px; border-radius:8px; white-space:nowrap;
  }
  .zone-caption.front { color:var(--teal); background:rgba(78,205,196,.08); }
  .zone-caption.back { color:var(--purple); background:rgba(167,139,250,.08); }

  .seat {
    position:relative; flex-direction:column; gap:2px;
    background:var(--bg); border:1px solid var(--border);
    padding:10px 4px; min-height:64px;
    font-size:.86rem; font-weight:700; transition: background .2s, border-color .2s, transform .2s;
  }
  .seat.zone-front-seat { border-top:3px solid rgba(78,205,196,.45); }
  .seat.zone-back-seat  { border-top:3px solid rgba(167,139,250,.45); }
  .seat.empty { color:var(--muted); font-weight:400; font-size:.78rem; }
  .seat.filled.rolling { color:var(--muted); font-family:'DM Mono',monospace; font-size:.72rem; }
  .seat.filled.settled { animation: seat-pop .35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes seat-pop { 0%{transform:scale(.85);opacity:.4;} 100%{transform:scale(1);opacity:1;} }
  .seat .badge {
    position:absolute; top:-8px; right:-6px; font-size:.85rem;
    background:var(--surface); border-radius:50%; padding:1px;
  }
  .seat .badge.unmet { filter: grayscale(1) opacity(.6); }

  /* ===== 実行ボタン ===== */
  .btn-row { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  button.primary {
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700;
    border:none; border-radius:100px; cursor:pointer;
    flex:0 1 320px; padding:20px 30px; font-size:1.1rem;
    background:var(--accent); color:#0d0f1a;
    box-shadow:0 4px 22px rgba(245,200,66,.28);
    transition:transform .15s, box-shadow .15s, opacity .2s;
  }
  button.primary:hover:not(:disabled) { box-shadow:0 6px 30px rgba(245,200,66,.48); transform:translateY(-1px); }
  button.primary:active:not(:disabled) { transform:scale(.97); }
  button.primary:disabled { opacity:.4; cursor:not-allowed; }
  button.secondary {
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700;
    padding:20px 26px; font-size:.95rem; border-radius:100px; cursor:pointer;
    background:var(--surface); color:var(--muted); border:1px solid var(--border);
  }
  button.secondary:hover { background:var(--border); color:var(--text); }

  #warning-box {
    display:none; background:rgba(255,107,107,.08); border:1px solid rgba(255,107,107,.3);
    border-radius:12px; padding:14px 18px; font-size:.85rem; color:#ffb4b4; line-height:1.7;
  }
  #warning-box.visible { display:block; }
  #warning-box b { color:var(--red); }

  .particle {
    position:fixed; pointer-events:none; border-radius:50%; z-index:999;
    animation:fly 1.1s ease-out forwards;
  }
  @keyframes fly {
    0%   { transform:translate(0,0) scale(1); opacity:1; }
    100% { transform:translate(var(--tx),var(--ty)) scale(0); opacity:0; }
  }

  @media (max-width: 700px) {
    html { font-size: 15px; }
    body { padding: 40px 14px 70px; }
    h1 { font-size: 1.7rem; }
    section { padding: 18px 16px; }
    .scroll-hint { display:block; }
    button.primary, button.secondary { flex-basis: 100%; }
  }

  @media print {
    body::before, #nav-link, #student-settings, .btn-row, #warning-box, .legend { display:none !important; }
    body { padding:10px; background:#fff; color:#000; }
    section { background:#fff; border-color:#999; }
    .seat { border-color:#999; background:#fff; color:#000; }
    .cell-label, .cell-teacher, .zone-caption { color:#333; background:#fff; border-color:#999; }
  }
</style>
</head>
<body>

<a id="nav-link" href="index.html">← お題抽選器へ</a>

<main>
  <header>
    <div class="label">Seat Lottery</div>
    <h1>教室の<span>席替え抽選</span></h1>
    <p class="sub">スクリーン希望・サブ講師希望の生徒を優先ゾーンに配置しつつ、残りはランダムに席替えします。</p>
  </header>

  <section id="student-settings">
    <h2>👥 生徒と希望の設定</h2>
    <p class="desc">名前は自由に編集・追加・削除できます。「🖥 スクリーン希望」は前2列、「🙋 サブ講師希望」は後2列を優先して割り当てます。両方チェックした生徒はどちらか一方の空きに優先配置されます。</p>
    <div id="student-list"></div>
    <div class="list-actions">
      <button type="button" class="ghost-btn" onclick="addStudent()">＋ 生徒を追加</button>
      <button type="button" class="ghost-btn warn" onclick="resetToDefault()">🔄 デフォルト名簿(25名)に戻す</button>
    </div>
    <p class="count-note" id="count-note"></p>
  </section>

  <section>
    <h2>🗺️ 座席表</h2>
    <div class="legend">
      <div class="legend-item"><span class="legend-dot" style="background:rgba(78,205,196,.45)"></span>スクリーン優先ゾーン(前2列)</div>
      <div class="legend-item"><span class="legend-dot" style="background:rgba(167,139,250,.45)"></span>サブ講師優先ゾーン(後2列)</div>
      <div class="legend-item">🖥 = スクリーン希望を実現</div>
      <div class="legend-item">🙋 = サブ講師希望を実現</div>
    </div>
    <p class="scroll-hint">→ 横にスクロールできます</p>
    <div class="map-scroll">
      <div id="seat-map"></div>
    </div>
  </section>

  <div id="warning-box"></div>

  <div class="btn-row">
    <button type="button" class="primary" id="shuffle-btn" onclick="runShuffle()">🎲 席をシャッフルする</button>
    <button type="button" class="secondary" onclick="window.print()">🖨 印刷する</button>
  </div>
</main>

<script>
// =============================================
//  教室レイアウト（アップロードされた座席表①②に基づく）
//  出入口(前) → 講師席(前) → 座席4列(各列: 左4席+右2〜3席) → サブ講師席(後)
// =============================================
const DEFAULT_NAMES = ["笠原","小笠原","榎本","井本","泉野","石川","池田","千葉","高橋","榮","久保","木村","加藤","前窪","辺見","能見","中山","中嶋","寺田","山岡","保田","森本","森實","松原","松永"];

// col: 1-4 = 左ブロック, 5 = 通路, 6-8 = 右ブロック（1列目のみ8まで使用）
const SEATS = [];
[1,2,3,4].forEach(row => {
  [1,2,3,4].forEach(col => SEATS.push({ id:`r${row}c${col}`, row, col }));
  const rightCols = row === 1 ? [6,7,8] : [6,7];
  rightCols.forEach(col => SEATS.push({ id:`r${row}c${col}`, row, col }));
});

function isFrontZone(seat) { return seat.row <= 2; }
function isBackZone(seat)  { return seat.row >= 3; }
// grid行: 1=出入口 2=講師 3=前ゾーン見出し 4-5=座席1-2列目 6=後ゾーン見出し 7-8=座席3-4列目 9=サブ講師
const SEAT_GRID_ROW = { 1:4, 2:5, 3:7, 4:8 };
function gridRowOf(seatRow) { return SEAT_GRID_ROW[seatRow]; }

// =============================================
//  生徒データ（localStorageに保存）
// =============================================
const STORAGE_KEY = 'seatLottery.students.v1';
let students = [];
let uidSeq = 1;
const newId = () => 'st' + (uidSeq++);

function loadStudents() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length) {
        students = parsed.map(s => ({ id: newId(), name: s.name || '', screenPref: !!s.screenPref, subPref: !!s.subPref }));
        return;
      }
    }
  } catch (e) { /* 無視してデフォルトへ */ }
  students = DEFAULT_NAMES.map(name => ({ id: newId(), name, screenPref:false, subPref:false }));
}

function saveStudents() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(students.map(({name,screenPref,subPref}) => ({name,screenPref,subPref}))));
  } catch (e) { /* 保存できなくても続行 */ }
}

function resetToDefault() {
  if (!confirm('デフォルトの25名の名簿にリセットします。現在の編集内容は失われます。よろしいですか？')) return;
  students = DEFAULT_NAMES.map(name => ({ id: newId(), name, screenPref:false, subPref:false }));
  saveStudents(); renderStudentList(); renderSeatMap(null);
}

function addStudent() {
  students.push({ id:newId(), name:'', screenPref:false, subPref:false });
  saveStudents(); renderStudentList();
}

function removeStudent(id) {
  students = students.filter(s => s.id !== id);
  saveStudents(); renderStudentList();
}

function renderStudentList() {
  const list = document.getElementById('student-list');
  list.innerHTML = students.map((s, i) => `
    <div class="student-row" data-id="${s.id}">
      <span class="idx">${i+1}</span>
      <input type="text" value="${escapeHtml(s.name)}" placeholder="生徒名" data-role="name">
      <span class="pref-chip screen ${s.screenPref ? 'on' : ''}" data-role="screen">🖥 スクリーン希望</span>
      <span class="pref-chip sub ${s.subPref ? 'on' : ''}" data-role="sub">🙋 サブ講師希望</span>
      <button type="button" class="del-btn" data-role="del">✕</button>
    </div>
  `).join('');
  updateCountNote();
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('student-list').addEventListener('input', (e) => {
  const row = e.target.closest('.student-row'); if (!row) return;
  const s = students.find(s => s.id === row.dataset.id); if (!s) return;
  if (e.target.dataset.role === 'name') { s.name = e.target.value; saveStudents(); }
});

document.getElementById('student-list').addEventListener('click', (e) => {
  const row = e.target.closest('.student-row'); if (!row) return;
  const s = students.find(s => s.id === row.dataset.id); if (!s) return;
  const role = e.target.dataset.role;
  if (role === 'screen') { s.screenPref = !s.screenPref; saveStudents(); renderStudentList(); }
  else if (role === 'sub') { s.subPref = !s.subPref; saveStudents(); renderStudentList(); }
  else if (role === 'del') { removeStudent(s.id); }
});

function updateCountNote() {
  const note = document.getElementById('count-note');
  const n = students.filter(s => s.name.trim()).length;
  note.textContent = `登録人数: ${n} / 座席数: ${SEATS.length}`;
  note.classList.toggle('over', n > SEATS.length);
}

// =============================================
//  座席表の描画
// =============================================
function renderSeatMap(assignment) {
  const map = document.getElementById('seat-map');
  const html = [];

  html.push(`<div class="cell cell-label" style="grid-row:1;grid-column:2/4;">🚪 出入口</div>`);
  html.push(`<div class="cell cell-teacher" style="grid-row:2;grid-column:5/7;">🧑‍🏫 講師席</div>`);
  html.push(`<div class="cell zone-caption front" style="grid-row:3;grid-column:1/9;justify-self:start;">👀 スクリーン優先ゾーン（1〜2列目）</div>`);
  html.push(`<div class="cell zone-caption back" style="grid-row:6;grid-column:1/9;justify-self:start;">🙋 サブ講師優先ゾーン（3〜4列目）</div>`);

  SEATS.forEach(seat => {
    const student = assignment ? assignment.get(seat.id) : null;
    const zoneClass = isFrontZone(seat) ? 'zone-front-seat' : 'zone-back-seat';
    let badge = '';
    if (student) {
      if (student.screenPref && isFrontZone(seat)) badge += `<span class="badge" title="スクリーン希望を実現">🖥</span>`;
      if (student.subPref && isBackZone(seat)) badge += `<span class="badge" title="サブ講師希望を実現">🙋</span>`;
    }
    const content = student
      ? `<span class="seat-name">${escapeHtml(student.name || '(無名)')}</span>${badge}`
      : `<span class="seat-name">空席</span>`;
    html.push(`<div class="cell seat ${zoneClass} ${student ? 'filled settled' : 'empty'}" style="grid-row:${gridRowOf(seat.row)};grid-column:${seat.col};">${content}</div>`);
  });

  html.push(`<div class="cell cell-label" style="grid-row:${gridRowOf(4)+1};grid-column:2/4;">🙋 サブ講師席</div>`);

  map.innerHTML = html.join('');
}

// =============================================
//  抽選ロジック
// =============================================
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function assignSeats(activeStudents) {
  const both       = shuffleArray(activeStudents.filter(s => s.screenPref && s.subPref));
  const screenOnly = shuffleArray(activeStudents.filter(s => s.screenPref && !s.subPref));
  const subOnly    = shuffleArray(activeStudents.filter(s => !s.screenPref && s.subPref));

  let frontSeats = shuffleArray(SEATS.filter(isFrontZone));
  let backSeats  = shuffleArray(SEATS.filter(isBackZone));

  const assignment = new Map();
  const usedSeatIds = new Set();
  const usedStudentIds = new Set();

  function takeFrom(seatList) {
    while (seatList.length) {
      const seat = seatList.shift();
      if (!usedSeatIds.has(seat.id)) return seat;
    }
    return null;
  }
  function place(seat, student) {
    if (!seat) return false;
    assignment.set(seat.id, student);
    usedSeatIds.add(seat.id);
    usedStudentIds.add(student.id);
    return true;
  }

  both.forEach(st => {
    const frontFirst = Math.random() < 0.5;
    const seat = frontFirst
      ? (takeFrom(frontSeats) || takeFrom(backSeats))
      : (takeFrom(backSeats) || takeFrom(frontSeats));
    place(seat, st);
  });
  screenOnly.forEach(st => place(takeFrom(frontSeats), st));
  subOnly.forEach(st => place(takeFrom(backSeats), st));

  const remainingStudents = shuffleArray(activeStudents.filter(s => !usedStudentIds.has(s.id)));
  const remainingSeats = shuffleArray(SEATS.filter(s => !usedSeatIds.has(s.id)));
  remainingStudents.forEach((st, i) => { if (remainingSeats[i]) place(remainingSeats[i], st); });

  return assignment;
}

function collectUnmet(activeStudents, assignment) {
  const seatById = new Map(SEATS.map(s => [s.id, s]));
  const seatOf = new Map();
  assignment.forEach((student, seatId) => seatOf.set(student.id, seatById.get(seatId)));

  const unmet = [];
  activeStudents.forEach(st => {
    const seat = seatOf.get(st.id);
    if (st.screenPref && (!seat || !isFrontZone(seat))) unmet.push(`${st.name || '(無名)'}さん（スクリーン希望）`);
    if (st.subPref && (!seat || !isBackZone(seat))) unmet.push(`${st.name || '(無名)'}さん（サブ講師希望）`);
  });
  return unmet;
}

let rollTimer = null;
function runShuffle() {
  const btn = document.getElementById('shuffle-btn');
  const warningBox = document.getElementById('warning-box');
  const activeStudents = students.filter(s => s.name.trim());

  if (activeStudents.length === 0) {
    alert('生徒を1人以上登録してください。');
    return;
  }
  if (activeStudents.length > SEATS.length) {
    alert(`座席数(${SEATS.length}席)を超えています。人数を${activeStudents.length - SEATS.length}人減らしてください。`);
    return;
  }

  btn.disabled = true; btn.textContent = '抽選中...';
  warningBox.classList.remove('visible');
  renderSeatMap(null);

  const namesPool = activeStudents.map(s => s.name || '(無名)');
  let ticks = 0;
  rollTimer = setInterval(() => {
    document.querySelectorAll('#seat-map .seat').forEach(el => {
      el.classList.add('filled', 'rolling');
      el.classList.remove('settled', 'empty');
      const nameEl = el.querySelector('.seat-name');
      if (nameEl) nameEl.textContent = namesPool[Math.floor(Math.random() * namesPool.length)];
    });
    ticks++;
    if (ticks >= 10) {
      clearInterval(rollTimer);
      finalizeShuffle(activeStudents);
    }
  }, 60);
}

function finalizeShuffle(activeStudents) {
  const btn = document.getElementById('shuffle-btn');
  const warningBox = document.getElementById('warning-box');
  const assignment = assignSeats(activeStudents);
  renderSeatMap(assignment);
  spawnParticles(document.getElementById('seat-map'));

  const unmet = collectUnmet(activeStudents, assignment);
  if (unmet.length) {
    warningBox.innerHTML = `<b>⚠ 希望に沿えなかった生徒がいます（座席数の都合）：</b><br>${unmet.join('、 ')}`;
    warningBox.classList.add('visible');
  }

  btn.disabled = false; btn.textContent = '🎲 もう一度シャッフルする';
}

function spawnParticles(el) {
  const cols = ['#f5c842', '#4ecdc4', '#a78bfa', '#ff6b6b', '#fb923c'];
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width / 2, cy = rect.top + Math.min(rect.height, 300) / 2;
  for (let i = 0; i < 24; i++) {
    const p = document.createElement('div'); p.className = 'particle';
    const sz = 5 + Math.random() * 8, ang = Math.random() * Math.PI * 2, d = 80 + Math.random() * 200;
    p.style.cssText = `left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;
      background:${cols[Math.floor(Math.random() * cols.length)]};
      --tx:${Math.cos(ang) * d}px;--ty:${Math.sin(ang) * d}px;
      animation-duration:${.7 + Math.random() * .5}s;`;
    document.body.appendChild(p); setTimeout(() => p.remove(), 1300);
  }
}

// =============================================
//  初期化
// =============================================
loadStudents();
renderStudentList();
renderSeatMap(null);
</script>
